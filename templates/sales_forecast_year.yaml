apiVersion: rpt/v1
kind: Report
metadata:
  code: sales_forecast_year
  name: 销售年度预测填报
  version: 2
spec:
  params: []
  rows:
    source: mssql
    query: >
      SELECT CAST(forecast_year AS varchar) AS year, pln_type AS ftype,
        jan_orders AS m01, feb_orders AS m02, mar_orders AS m03, apr_orders AS m04,
        may_orders AS m05, jun_orders AS m06, jul_orders AS m07, aug_orders AS m08,
        sep_orders AS m09, oct_orders AS m10, nov_orders AS m11, dec_orders AS m12
      FROM forecast_order_baseline
      ORDER BY forecast_year
    editable_rows: true
  columns:
    - { key: seq, label: 序号, type: auto, readonly: true }
    - { key: year, label: 年度, type: int }
    - { key: ftype, label: 预测类型, type: text }
    - { key: m01, label: 1月, type: int }
    - { key: m02, label: 2月, type: int }
    - { key: m03, label: 3月, type: int }
    - { key: m04, label: 4月, type: int }
    - { key: m05, label: 5月, type: int }
    - { key: m06, label: 6月, type: int }
    - { key: m07, label: 7月, type: int }
    - { key: m08, label: 8月, type: int }
    - { key: m09, label: 9月, type: int }
    - { key: m10, label: 10月, type: int }
    - { key: m11, label: 11月, type: int }
    - { key: m12, label: 12月, type: int }
    - { key: total, label: 合计, type: int, readonly: true, formula: "sum(m01..m12)" }
  validation:
    - { cols: ["year"], rule: "v >= 2020 && v <= 2035" }
    - { cols: ["m01..m12"], rule: "v >= 0" }
    - { rule: "unique(year, ftype)" }
  import:
    mode: overwrite
    match_keys: [year, ftype]
    on_unmatched: report
  export:
    layout:
      freeze_header: true
      number_format: "#,##0"
  submit:
    target: mssql
    mode: upsert
    mssql:
      table: forecast_order_baseline
      keys: [pln_type, forecast_year]
      mapping:
        ftype: pln_type
        year: forecast_year
        "m01": jan_orders
        "m02": feb_orders
        "m03": mar_orders
        "m04": apr_orders
        "m05": may_orders
        "m06": jun_orders
        "m07": jul_orders
        "m08": aug_orders
        "m09": sep_orders
        "m10": oct_orders
        "m11": nov_orders
        "m12": dec_orders
        total: total_orders
        "now()": update_time
    lock_after: true
  push:
    - { channel: dingtalk, to: sales-group, on: submit }
