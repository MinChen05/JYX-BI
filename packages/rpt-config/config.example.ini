; JYX-BI 配置样例（复制为 apps/server/config.ini 并填写，禁止提交真实值）

[server]
addr = :8090
mode = release

[system]
; 系统库（草稿/状态/审计/模板版本）：
; 以 / 开头或 .db 结尾 = SQLite 文件（推荐，零依赖）；否则按 MySQL DSN 解析
dsn = data/kingdee-rpt.db

[mysql]
; 兼容旧配置（system.dsn 为空时生效）
dsn =

[doris]
; 主数据库（MySQL 协议端口），基础资料行集用
dsn = root:yourpassword@tcp(192.169.0.188:9030)/dw_pro?charset=utf8mb4&parseTime=True&loc=Local

[sqlserver]
; 生产 MSSQL（报表源表 + 写回）
host = 10.10.10.191
port = 1433
user = sa
password =
database = Kingdee
encrypt = disable

[smtp]
host =
port = 465
user =
pass =
from =

[dingtalk]
webhook =
secret =

[templates]
dir = ../../templates
